version: 2

models:
  - name: stg_races
    description: Cleaned race schedule data from the Ergast API source.
    columns:
      - name: race_id
        description: Unique identifier for each race.
        tests:
          - not_null
          - unique
      - name: year
        description: Season year.
        tests:
          - not_null
      - name: round
        description: Round number within the season.
        tests:
          - not_null
      - name: date
        description: Date the race took place.

  - name: stg_results
    description: Cleaned race result data from the Ergast API source.
    columns:
      - name: race_id
        description: Foreign key to stg_races.
        tests:
          - not_null
      - name: constructor_id
        description: Unique identifier for the constructor.
        tests:
          - not_null
      - name: driver_id
        description: Unique identifier for the driver.
        tests:
          - not_null
      - name: grid
        description: Starting grid position.
      - name: position
        description: Finishing position. NULL if the driver did not finish.
      - name: status_id
        description: Foreign key to the status table describing the race outcome.

  - name: stg_constructor_year
    description: Custom lookup mapping constructor identities to a year-specific ID, tracking name/entity changes across seasons.
    columns:
      - name: constructor_id
        description: Unique identifier for the constructor.
        tests:
          - not_null
      - name: year
        description: Season year the mapping applies to.
        tests:
          - not_null
      - name: constructor_year_id
        description: Year-scoped constructor identifier.
        tests:
          - not_null
